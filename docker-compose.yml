# =====================================================================
# AI 数据自动化转换 Demo - 一键启动编排文件
# 服务构成：InterSystems IRIS for Health（FHIR 数据源 + 转换平台）
#         + Flask 后端（API + AI 推荐）+ Vue 前端（nginx 部署）
# =====================================================================

services:
  # ---------- InterSystems IRIS for Health（FHIR Server + Production + 目标表） ----------
  iris:
    # for Health 社区版镜像：自带 FHIR Server 能力（数据源）与互操作性 Production（转换平台）
    image: containers.intersystems.com/intersystems/irishealth-community:2026.1
    container_name: dataflow-iris
    # -a: IRIS 启动后执行统一初始化脚本（凭据 + FHIR Server 搭建 + 编译 + 启动 Production）
    command: ["-a", "/shared/setup.sh"]
    ports:
      - "52773:52773"   # 管理门户 / Web 网关 / FHIR endpoint
      - "1972:1972"     # 超级服务器端口
    environment:
      IRIS_PASSWORD: SYS   # 约定：所有 Demo 统一使用 superuser / SYS 登录
      # 【重要】IRIS 数据目录必须指向挂载卷内的子目录，否则数据落在镜像内 /usr/irissys/mgr：
      # 容器一旦重建（docker compose up -d iris），FHIR 数据、Production 定义、DSN、CLINIC 演示库全部丢失
      ISC_DATA_DIRECTORY: /dur/irissys
      # 内嵌 Java 网关（%Java Server）编码：容器默认 locale 为 POSIX，JVM 会退回 ASCII，
      # 导致 JDBC 读回的中文在行 JSON 里变成 "?"（SQL 源中文姓名丢失）
      LANG: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    volumes:
      - ./iris/init-password.sh:/shared/init-password.sh:ro   # 凭据初始化脚本
      - ./iris/setup.sh:/shared/setup.sh:ro                   # 统一初始化入口
      - ./iris/src:/shared/src:ro                             # ObjectScript 源码（Production 组件）
      - ./iris/python:/shared/python:ro                       # Embedded Python 业务逻辑
      - ./iris/sql:/shared/sql:ro                             # SQL 初始化脚本
      - ./data/iris:/dur                                      # IRIS 数据目录持久化
    networks:
      - dataflow-net

  # ---------- Flask 后端 API 服务（数据源管理 + AI 推荐 + 管道下发） ----------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dataflow-backend
    ports:
      # 宿主 5001 -> 容器内 5000（宿主 5000 常被 macOS 隔空播放等占用）
      - "5001:5000"
    environment:
      IRIS_HOST: iris          # 通过 Docker 网络访问 IRIS 服务名
      IRIS_PORT: "1972"
      IRIS_NAMESPACE: USER
      IRIS_USERNAME: superuser   # 约定：所有 Demo 统一使用 superuser / SYS 登录
      IRIS_PASSWORD: SYS
      # FHIR 仓库（演示默认：**源 = DemoFHIR 第二个独立仓库，目标 = FHIRSERVER 实例自带**），经 Docker 网络访问
      FHIR_BASE_URL: http://iris:52773/csp/healthshare/demofhir/fhir/r4/
      FHIR_TARGET_BASE_URL: http://iris:52773/csp/healthshare/fhirserver/fhir/r4/
      FHIR_USERNAME: superuser
      FHIR_PASSWORD: SYS
      # LLM（OpenAI 兼容接口）配置，来自宿主 .env
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      # FHIR 演示种子开关：默认 0 = 启动不灌种子（演示数据一律用时现造）。
      # 说明：播种脚本已移出启动链（见 tools/seed_fhir_demo.py），此变量仅对
      # "重建前旧镜像内嵌的 init_fhir_data.py" 生效，作兼容保留。
      SEED_FHIR: ${SEED_FHIR:-0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      # LLM 超时/重试（缺陷 N9）：单次读超时、建连超时、SDK 重试次数、单次调用墙钟总预算
      LLM_TIMEOUT: ${LLM_TIMEOUT:-240}
      LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-10}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_TIMEOUT_TOTAL: ${LLM_TIMEOUT_TOTAL:-480}
    volumes:
      - ./backend:/app/backend
      - ./init_data.py:/app/init_data.py
      - ./cleanup_demo.py:/app/cleanup_demo.py
      - ./generate_mock_data.py:/app/generate_mock_data.py
      - ./jdbc:/app/jdbc            # JDBC 驱动 jar（转换目标通用连接）
    depends_on:
      - iris
    networks:
      - dataflow-net

  # ---------- 前端 Vue3 应用（nginx 多阶段构建部署） ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dataflow-frontend
    ports:
      - "80:80"            # 对外通过 http://localhost 访问
    depends_on:
      - backend
    networks:
      - dataflow-net

  # ---------- 术语服务器（trimmed fork of intersystems-ib/iris-terminology-server, MIT, by Luis Angel Pérez Ramos — 功劳归作者，致谢）----------
  # 仅用于术语「存储 + 检索/校验」（CodeSystem/$lookup $validate-code $subsumes、ValueSet/$expand）；
  # 术语转换/映射由本平台 AI 数据转换 Skill 负责（不在术语服务器做）。
  # 裁剪内容见子模块分支 demo-community：community 镜像 / 关闭 vector / 精简依赖。
  iris-terminology:
    build:
      context: ./termsrv
      dockerfile: iris/Dockerfile
    container_name: iris-terminology
    init: true
    ports:
      - "52774:52773"   # 术语服务器 Web / FHIR 术语面（与 demo 52773 错开）
      - "51774:1972"    # 超级服务器（与 demo 1972 错开）
    environment:
      IRIS_PASSWORD: SYS    # 与 demo 约定一致的登录凭据 superuser / SYS
    volumes:
      - ./termsrv:/termsrv:ro            # 术语摄入源文件/脚本只读参考
      - ./data/iris-terminology:/dur     # 数据目录（容器重建后需重导术语）
      - ./data/terms-inbox:/terms-inbox:ro   # 药品目录术语 TSV（导入用）
    networks:
      - dataflow-net

  # ---------- 本地 Embedding 服务（术语向量化，Qwen3-Embedding-0.6B 多语言） ----------
  # OpenAI 兼容 /v1/embeddings；模型文件从 ModelScope 下载（国内可直连）到 ./data/embedding-model
  embedding:
    build:
      context: ./embedding
      dockerfile: Dockerfile
    container_name: dataflow-embedding
    ports:
      - "8001:8000"       # 宿主调试端口（业务访问走内部 http://embedding:8000）
    environment:
      MODEL_DIR: /models/Qwen3-Embedding-0.6B
      MODEL_SCOPE_ID: Qwen/Qwen3-Embedding-0.6B
    volumes:
      - ./data/embedding-model:/models
    networks:
      - dataflow-net

# 统一 Docker 网络，三个服务互联
networks:
  dataflow-net:
    driver: bridge
